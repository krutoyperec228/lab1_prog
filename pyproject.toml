[project]
name = "sports-club"
version = "2.0.0"
description = "Консольное приложение для управления спортивным клубом «Олимп»"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sports-club = "sports_club.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/sports_club"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"